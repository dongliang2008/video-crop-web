<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频裁剪 Web · 交互原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='3' fill='%23e8a33d'/%3E%3Cpath d='M10 8.5v7l5-3.5z' fill='%23171b21'/%3E%3C/svg%3E">
<style>
:root{--bg:#17181c;--panel:#1f2127;--panel2:#262932;--line:#33363f;--text:#d6d8dd;--dim:#8a8f9a;--accent:#e8a33d;--accent2:#4f8fd6;--danger:#d0453b;--ok:#4cae6a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:6px}
.logo svg{width:18px;height:18px}
.btn{padding:5px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.primary:hover{opacity:.9}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#17181c;font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{flex:1;display:flex;min-height:0}
.col{border-right:1px solid var(--line);padding:10px 12px;overflow-y:auto;min-height:0}
.col:last-child{border-right:none}
.col-left{width:30%;min-width:280px}
.col-mid{width:44%;min-width:360px;display:flex;flex-direction:column}
.col-right{width:26%;min-width:300px}
.sec-title{font-size:11px;color:var(--dim);text-transform:none;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
video{width:100%;background:#000;border-radius:8px;max-height:38vh}
#playerWrap{background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;margin-bottom:8px;position:relative}
#frameCanvas{width:100%;display:block;cursor:crosshair;border-radius:8px;background:#0c0e12}
.frame-info{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.time-chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-family:Consolas,monospace;font-size:13px;color:var(--accent)}
.mode-switch{display:flex;gap:6px;margin-bottom:8px}
.mode-switch .btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.region-row{font-size:12px;color:var(--dim);line-height:1.8;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.region-row b{color:var(--text)}
.wm-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin-bottom:5px}
.wm-item .num{color:var(--accent);font-weight:700;margin-right:6px}
.wm-item span{color:var(--dim)}
.seg-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.seg-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.seg-card .head .seg-name{font-weight:700;color:var(--accent)}
.seg-card .head .seg-time{font-family:Consolas,monospace;font-size:12px;color:var(--text)}
.dir-group{display:flex;gap:4px}
.dir-group .btn{padding:3px 10px;font-size:11px}
.dir-group .btn.sel{background:var(--accent);border-color:var(--accent);color:#17181c;font-weight:700}
.task-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;border-left:3px solid var(--line)}
.task-card.state-wait{border-left-color:var(--accent)}
.task-card.state-done{border-left-color:var(--ok)}
.task-card.state-fail{border-left-color:var(--danger)}
.task-card .t-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.task-card .t-name{font-size:12px;font-weight:700;word-break:break-all}
.task-card .t-status{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.st-wait{background:#fff7e6;color:#d46b08}
.st-done{background:#f6ffed;color:#52c41a}
.st-fail{background:#fff1f0;color:#cf1322}
.st-run{background:#e6f7ff;color:#096dd9}
.preview-box{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.preview-box canvas{width:160px;height:90px;border-radius:6px;border:1px solid var(--accent)}
.preview-ops{display:flex;flex-direction:column;gap:4px}
.empty-hint{color:var(--dim);font-size:12px;text-align:center;padding:16px 8px;border:1px dashed var(--line);border-radius:8px}
footer{display:flex;align-items:center;gap:14px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
footer .ok{color:var(--ok)}
#toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);background:#262932;border:1px solid var(--accent2);color:var(--text);padding:8px 16px;border-radius:8px;font-size:12px;display:none;z-index:99}
@media (max-width: 860px){
  body{overflow:auto;height:auto}
  main{flex-direction:column}
  .col{width:100% !important;min-width:0 !important;border-right:none;border-bottom:1px solid var(--line)}
}
/* AI 命名弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.modalBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(860px,94vw);max-height:92vh;overflow-y:auto;padding:14px 18px}
.modalBox h3{font-size:14px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.slotRow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;flex-wrap:wrap}
.slotPrev{width:150px;height:84px;background:#000;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;overflow:hidden;flex-shrink:0}
.slotPrev canvas{width:100%;height:100%}
.slotKw{flex:1;min-width:140px;font-size:12px;color:var(--dim);line-height:1.6;background:var(--panel);border-radius:6px;padding:6px 8px;min-height:30px}
.slotKw .tag{display:inline-block;background:#31445e;color:#cfe0f5;border-radius:4px;padding:1px 7px;margin:2px 3px;font-size:11px}
.rename-result{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px}
.rename-result input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;margin-top:6px;font-family:Consolas,monospace;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="logo"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3" fill="%23e8a33d"/><path d="M10 8.5v7l5-3.5z" fill="%23171b21"/></svg>视频裁剪 Web</div>
  <button class="btn primary" onclick="openVideo()">打开视频…</button>
  <span id="srcLabel" style="color:var(--dim);font-size:12px;flex:1;min-width:160px;word-break:break-all">未加载源视频</span>
  <button class="btn" onclick="toast('演示：项目已保存到本地 SQLite')">保存项目</button>
  <button class="btn" onclick="resetAll()">新建项目</button>
</header>

<main>
  <!-- 左：预览与帧选 -->
  <section class="col col-left">
    <div class="sec-title">视频预览 · 帧级选时 <span id="srcMeta" style="color:var(--dim)"></span></div>
    <div id="playerWrap">
      <canvas id="frameCanvas" width="640" height="360"></canvas>
    </div>
    <div class="frame-info">
      <span class="time-chip" id="curTime">00:00.000</span>
      <button class="btn small" onclick="stepFrame(-1)">-1帧</button>
      <button class="btn small" onclick="stepFrame(1)">+1帧</button>
      <button class="btn small" onclick="stepSec(-1)">-1s</button>
      <button class="btn small" onclick="stepSec(1)">+1s</button>
      <button class="btn small" onclick="stepSec(-5)">-5s</button>
      <button class="btn small" onclick="stepSec(5)">+5s</button>
    </div>
    <div class="frame-info">
      <button class="btn" onclick="setSegStart()">设起始帧</button>
      <button class="btn" onclick="setSegEnd()">设结束帧</button>
      <span style="color:var(--dim);font-size:11px">先在播放器选到目标画面，再点设起/设止</span>
    </div>
  </section>

  <!-- 中：框选画布 -->
  <section class="col col-mid">
    <div class="sec-title">画面框选 · 抽当前帧作底图</div>
    <div class="mode-switch">
      <button class="btn active" id="modeCrop" onclick="setMode('crop')">裁剪区域（1个）</button>
      <button class="btn" id="modeWm" onclick="setMode('wm')">水印区域（多个）</button>
    </div>
    <canvas id="selCanvas" width="640" height="360"></canvas>
    <div class="region-row" id="cropInfo">裁剪区域：未框选（输出整帧画面）</div>
    <div id="wmList"></div>
  </section>

  <!-- 右：时间段 + 任务 -->
  <section class="col col-right">
    <div class="sec-title">时间段 · 每段独立选方向</div>
    <div id="segList"></div>
    <div style="display:flex;gap:6px;margin:8px 0">
      <button class="btn warn" style="flex:1" onclick="genTasks()">生成任务</button>
      <button class="btn" onclick="startAll()">全部启动</button>
    </div>
    <div class="sec-title" style="margin-top:12px">任务列表（出片前确认图）</div>
    <div id="taskList"></div>
  </section>
</main>

<footer>
  <span>服务：<span class="ok">http://127.0.0.1:8100</span></span>
  <span id="footProj">项目：无</span>
  <span id="footState"></span>
</footer>

<!-- AI 命名弹窗 -->
<div class="modal" id="aiModal">
  <div class="modalBox">
    <h3>AI 辅助命名 <span id="aiTitle" style="font-size:12px;color:var(--dim);font-weight:400"></span> <button class="btn small" onclick="closeAi()">关闭</button></h3>
    <div style="font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px">
      选 3 帧 → 逐帧 AI 识别（智谱 GLM-4V）→ <b style="color:var(--accent)">结合源文件名关键词综合选词</b> → 自动命名
    </div>
    <div class="slotRow">
      <button class="btn small" onclick="pickAiFrame(0)">截取帧1</button>
      <div class="slotPrev" id="aiSlot0"></div>
      <button class="btn small" onclick="aiRecog(0)" id="aiRec0">AI识别</button>
      <div class="slotKw" id="aiKw0">未识别</div>
    </div>
    <div class="slotRow">
      <button class="btn small" onclick="pickAiFrame(1)">截取帧2</button>
      <div class="slotPrev" id="aiSlot1"></div>
      <button class="btn small" onclick="aiRecog(1)" id="aiRec1">AI识别</button>
      <div class="slotKw" id="aiKw1">未识别</div>
    </div>
    <div class="slotRow">
      <button class="btn small" onclick="pickAiFrame(2)">截取帧3</button>
      <div class="slotPrev" id="aiSlot2"></div>
      <button class="btn small" onclick="aiRecog(2)" id="aiRec2">AI识别</button>
      <div class="slotKw" id="aiKw2">未识别</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div class="rename-result" style="flex:1;min-width:220px">
        <div style="font-size:11px;color:var(--dim)">综合命名结果（源文件名关键词 + 3帧识别）</div>
        <input id="aiName" readonly value="（等待识别）">
      </div>
      <button class="btn primary" onclick="applyAiName()">确定：应用命名</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var src = null;                     // {name,w,h,dur,fps}
  var curTime = 0;
  var mode = 'crop';                  // crop | wm
  var crop = null;                    // {x,y,w,h}
  var wms = [];                       // [{x,y,w,h,sigma}]
  var segs = [];                      // [{id,start,end,direction}]
  var tasks = [];                     // [{id,segIdx,direction,name,state,preview}]
  var segSeq = 0, taskSeq = 0, wmSeq = 0, aiFrame = 0;
  var aiPicked = [null,null,null], aiKws = [[],[],[]];
  var currentAiTask = null;

  function $(id){ return document.getElementById(id); }
  function fmt(t){ t=Math.max(0,Math.min(t, src?src.dur:60)); var m=Math.floor(t/60), s=Math.floor(t%60), ms=Math.floor((t%1)*1000); return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+String(ms).padStart(3,'0'); }
  function drawScene(cv, t, w, h){
    var ctx = cv.getContext('2d'); if(!ctx) return;
    ctx.fillStyle = '#0c0e12'; ctx.fillRect(0,0,w,h);
    // 示意"帧画面"：渐变天空 + 山形 + 移动的太阳 + 网格标尺
    var g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1c2b4a'); g.addColorStop(0.55,'#3a5a8c'); g.addColorStop(1,'#7c9bb8');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = 'rgba(232,163,61,.9)';
    var sunX = 60 + (t % (src?src.dur:60)) * (w-120) / (src?src.dur:60); ctx.beginPath(); ctx.arc(sunX, 70, 18, 0, 7); ctx.fill();
    ctx.fillStyle = '#2f4a33';
    ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(w*0.2,h*0.62); ctx.lineTo(w*0.38,h*0.86); ctx.lineTo(w*0.55,h*0.58); ctx.lineTo(w*0.78,h*0.82); ctx.lineTo(w,h*0.6); ctx.lineTo(w,h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5b6b2f';
    ctx.fillRect(0,h*0.8,w,h*0.2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
    for(var i=1;i<10;i++){ ctx.beginPath(); ctx.moveTo(i*w/10,0); ctx.lineTo(i*w/10,h); ctx.stroke(); }
    for(var j=1;j<7;j++){ ctx.beginPath(); ctx.moveTo(0,j*h/6); ctx.lineTo(w,j*h/6); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '10px Consolas'; ctx.fillText('示意帧画面 · t=' + t.toFixed(1) + 's', 8, 16);
  }
  function refreshCanvas(){
    if(!src){ return; }
    var cv = $('frameCanvas'); drawScene(cv, curTime, cv.width, cv.height);
    // 框选画布 = 当前帧 + 叠加框
    var sc = $('selCanvas'); drawScene(sc, curTime, sc.width, sc.height);
    var ctx = sc.getContext('2d');
    if(mode==='crop' && crop){ drawRect(ctx, crop, '#4f8fd6', '裁剪区'); }
    wms.forEach(function(wm,i){ drawRect(ctx, wm, '#d0453b', '水印'+ (i+1)); });
    $('curTime').textContent = fmt(curTime);
    renderCropInfo();
  }
  function drawRect(ctx, r, color, label){
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = 'rgba(79,143,214,.12)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = color; ctx.font = '11px Microsoft YaHei';
    ctx.fillText(label + ' ' + Math.round(r.x)+','+Math.round(r.y)+' '+Math.round(r.w)+'x'+Math.round(r.h), r.x, Math.max(12, r.y-4));
  }
  function renderCropInfo(){
    $('cropInfo').innerHTML = crop
      ? ('裁剪区域：<b>(' + crop.x + ', ' + crop.y + ') ' + crop.w + '×' + crop.h + '</b> ｜ 输出该区域内画面 <button class="btn small" onclick="clearCrop()" style="margin-left:6px">清除</button>')
      : '裁剪区域：未框选（输出整帧画面）';
    $('wmList').innerHTML = wms.length ? wms.map(function(w,i){
      return '<div class="wm-item"><span><span class="num">'+(i+1)+'</span>('+w.x+','+w.y+') '+w.w+'×'+w.h+' · σ'+w.sigma+'</span><button class="btn small danger" onclick="delWm('+i+')">删除</button></div>';
    }).join('') : '<div class="empty-hint">未框选水印区域（可多个）</div>';
  }
  function renderSegs(){
    $('segList').innerHTML = segs.length ? segs.map(function(s,i){
      return '<div class="seg-card"><div class="head"><span class="seg-name">段'+(i+1)+'</span><span class="seg-time">'+fmt(s.start)+' ~ '+fmt(s.end)+' · '+ (s.end-s.start).toFixed(1)+'s</span></div>'+
        '<div class="dir-group"><button class="btn'+(s.direction==='vertical'?' sel':'')+'" onclick="setDir('+i+',\'vertical\')">竖屏</button>'+
        '<button class="btn'+(s.direction==='horizontal'?' sel':'')+'" onclick="setDir('+i+',\'horizontal\')">横屏</button>'+
        '<button class="btn'+(s.direction==='both'?' sel':'')+'" onclick="setDir('+i+',\'both\')">两者都要</button>'+
        '<button class="btn small danger" onclick="delSeg('+i+')">删除</button></div></div>';
    }).join('') : '<div class="empty-hint">还没有时间段：用左侧「设起始帧 / 设结束帧」添加</div>';
  }
  function renderTasks(){
    $('taskList').innerHTML = tasks.length ? tasks.map(function(t){
      var st = t.state, cls = '', label = '';
      if(st==='PENDING'){ cls=''; label='待启动'; }
      else if(st==='RUNNING'){ cls='st-run'; label='处理中…'; }
      else if(st==='WAIT_CONFIRM'){ cls='st-wait'; label='待确认'; }
      else if(st==='DONE'){ cls='st-done'; label='已完成'; }
      else if(st==='FAILED'){ cls='st-fail'; label='失败'; }
      return '<div class="task-card state-'+(st==='WAIT_CONFIRM'?'wait':st==='DONE'?'done':st==='FAILED'?'fail':'')+'">'+
        '<div class="t-head"><span class="t-name">'+t.name+'</span><span class="t-status '+cls+'">'+label+'</span></div>'+
        (st==='WAIT_CONFIRM' ? '<div class="preview-box"><canvas width="160" height="90"></canvas><div class="preview-ops"><button class="btn small primary" onclick="confirmTask('+t.id+')">确认输出</button><button class="btn small" onclick="cancelTask('+t.id+')">取消</button></div></div>' : '')+
        (st==='DONE' ? '<div class="preview-ops" style="margin-top:6px"><button class="btn small" onclick="openAi('+t.id+')">AI 命名</button></div>' : '')+
        '</div>';
    }).join('') : '<div class="empty-hint">未生成任务：先添加时间段，再点「生成任务」</div>';
  }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display = 'none'; }, 2200);
  }
  function paintPreview(cv){
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#1c2b4a'; ctx.fillRect(0,0,160,90);
    ctx.strokeStyle = '#4f8fd6'; ctx.lineWidth = 2; ctx.strokeRect(30,20,100,50);
    ctx.fillStyle = '#e8a33d'; ctx.font = '10px Consolas'; ctx.fillText('确认预览帧', 48, 50);
  }

  // ===== 全局导出（供 onclick）=====
  window.openVideo = function(){
    src = { name:'裁剪测试.mp4', w:1920, h:1080, dur:60, fps:30 };
    curTime = 0; crop = null; wms = []; segs = []; tasks = [];
    $('srcLabel').textContent = '源：D:\\DBdir\\素材\\视频\\通用\\裁剪测试.mp4';
    $('srcMeta').textContent = '(1920×1080 · 60s · 30fps)';
    $('footProj').textContent = '项目：裁剪测试（第 1 版）';
    refreshCanvas(); renderSegs(); renderTasks();
    toast('已加载演示源视频：裁剪测试.mp4');
  };
  window.resetAll = function(){
    src = null; curTime = 0; crop = null; wms = []; segs = []; tasks = [];
    $('srcLabel').textContent = '未加载源视频'; $('srcMeta').textContent = '';
    $('footProj').textContent = '项目：无';
    var cv = $('frameCanvas'), ctx = cv.getContext('2d'); ctx.fillStyle = '#0c0e12'; ctx.fillRect(0,0,cv.width,cv.height);
    var sc = $('selCanvas'), ctx2 = sc.getContext('2d'); ctx2.fillStyle = '#0c0e12'; ctx2.fillRect(0,0,sc.width,sc.height);
    renderCropInfo(); renderSegs(); renderTasks(); toast('已新建空项目');
  };
  window.stepFrame = function(d){ if(!src) return toast('先打开视频'); curTime = Math.min(src.dur-1/src.fps, Math.max(0, curTime + d/src.fps)); refreshCanvas(); };
  window.stepSec = function(d){ if(!src) return toast('先打开视频'); curTime = Math.min(src.dur, Math.max(0, curTime + d)); refreshCanvas(); };
  window.setSegStart = function(){
    if(!src) return toast('先打开视频');
    if(segs.length && segs[segs.length-1].end===null){ segs[segs.length-1].start = curTime; }
    else { segs.push({ id:++segSeq, start:curTime, end:null, direction:'both' }); }
    renderSegs(); toast('已设起始帧 ' + fmt(curTime));
  };
  window.setSegEnd = function(){
    if(!src) return toast('先打开视频');
    if(!segs.length || segs[segs.length-1].end!==null){ toast('先设起始帧'); return; }
    var s = segs[segs.length-1];
    if(curTime <= s.start){ toast('结束帧需晚于起始帧'); return; }
    s.end = curTime; renderSegs(); toast('段'+segs.length+' 已闭合：'+fmt(s.start)+' ~ '+fmt(s.end));
  };
  window.setDir = function(i, d){ segs[i].direction = d; renderSegs(); toast('段'+(i+1)+' 方向：'+({vertical:'竖屏',horizontal:'横屏',both:'两者都要'})[d]); };
  window.delSeg = function(i){ segs.splice(i,1); renderSegs(); };
  window.genTasks = function(){
    if(!src) return toast('先打开视频');
    if(!segs.length) return toast('先添加时间段');
    tasks = [];
    segs.forEach(function(s, i){
      if(!s.end) return toast('段'+(i+1)+' 还没设结束帧');
      if(s.direction==='vertical' || s.direction==='both') tasks.push({ id:++taskSeq, segIdx:i, direction:'vertical', name:'裁剪测试_段'+(i+1)+'_竖屏.mp4', state:'PENDING' });
      if(s.direction==='horizontal' || s.direction==='both') tasks.push({ id:++taskSeq, segIdx:i, direction:'horizontal', name:'裁剪测试_段'+(i+1)+'_横屏.mp4', state:'PENDING' });
    });
    renderTasks(); toast('已生成 '+tasks.length+' 条任务');
  };
  window.startAll = function(){
    if(!tasks.length) return toast('先生成任务');
    tasks.forEach(function(t){ if(t.state==='PENDING') startOne(t); });
  };
  function startOne(t){
    t.state = 'RUNNING'; renderTasks();
    setTimeout(function(){ t.state = 'WAIT_CONFIRM'; renderTasks(); toast('预览图已生成，等待确认：' + t.name); }, 800);
  }
  window.confirmTask = function(id){
    var t = tasks.find(function(x){ return x.id===id; }); if(!t || t.state!=='WAIT_CONFIRM') return;
    t.state = 'RUNNING'; renderTasks();
    setTimeout(function(){ t.state = 'DONE'; renderTasks(); toast('已输出：' + t.name); }, 1000);
  };
  window.cancelTask = function(id){
    var t = tasks.find(function(x){ return x.id===id; }); if(!t) return;
    t.state = 'PENDING'; renderTasks(); toast('已取消确认，可重新启动');
  };
  window.setMode = function(m){
    mode = m;
    $('modeCrop').classList.toggle('active', m==='crop');
    $('modeWm').classList.toggle('active', m==='wm');
    refreshCanvas();
  };
  window.clearCrop = function(){ crop = null; refreshCanvas(); toast('已清除裁剪区域'); };
  window.delWm = function(i){ wms.splice(i,1); refreshCanvas(); };

  // ===== Canvas 框选 =====
  var sc = $('selCanvas'), drag = null;
  sc.addEventListener('mousedown', function(e){
    if(!src) return;
    var r = sc.getBoundingClientRect();
    var x = (e.clientX - r.left) * sc.width / r.width, y = (e.clientY - r.top) * sc.height / r.height;
    drag = { x:x, y:y, w:0, h:0 };
  });
  sc.addEventListener('mousemove', function(e){
    if(!drag || !src) return;
    var r = sc.getBoundingClientRect();
    var x = (e.clientX - r.left) * sc.width / r.width, y = (e.clientY - r.top) * sc.height / r.height;
    drag.w = x - drag.x; drag.h = y - drag.y;
    var ctx = sc.getContext('2d');
    drawScene(sc, curTime, sc.width, sc.height);
    var d = normRect(drag);
    if(mode==='crop') drawRect(ctx, d, '#4f8fd6', '裁剪区');
    wms.forEach(function(wm,i){ drawRect(ctx, wm, '#d0453b', '水印'+(i+1)); });
  });
  sc.addEventListener('mouseup', function(){
    if(!drag || !src) return;
    var d = normRect(drag); drag = null;
    if(d.w < 4 || d.h < 4){ refreshCanvas(); return; }
    if(mode==='crop'){ crop = d; refreshCanvas(); toast('裁剪区域：('+Math.round(d.x)+','+Math.round(d.y)+') '+Math.round(d.w)+'×'+Math.round(d.h)); }
    else { wms.push({ x:Math.round(d.x), y:Math.round(d.y), w:Math.round(d.w), h:Math.round(d.h), sigma:30 }); refreshCanvas(); toast('已添加水印区域 ' + wms.length); }
  });
  function normRect(d){
    return { x:Math.min(d.x, d.x+d.w), y:Math.min(d.y, d.y+d.h), w:Math.abs(d.w), h:Math.abs(d.h) };
  }

  // ===== AI 命名 =====
  window.openAi = function(id){
    currentAiTask = tasks.find(function(x){ return x.id===id; }); if(!currentAiTask) return;
    aiPicked = [null,null,null]; aiKws = [[],[],[]]; aiFrame = 0;
    $('aiTitle').textContent = '｜ ' + currentAiTask.name;
    $('aiName').value = '（等待识别）';
    for(var i=0;i<3;i++){ $('aiSlot'+i).innerHTML = '未截取'; $('aiKw'+i).textContent = '未识别'; $('aiRec'+i).disabled = true; }
    $('aiModal').classList.add('open');
    toast('演示：真实版将从智谱 GLM-4V 识别，并综合源文件名关键词命名');
  };
  window.closeAi = function(){ $('aiModal').classList.remove('open'); };
  window.pickAiFrame = function(idx){
    if(!currentAiTask) return;
    var cv = document.createElement('canvas'); cv.width = 300; cv.height = 168;
    drawScene(cv, idx*17 + 5, 300, 168);
    $('aiSlot'+idx).innerHTML = '';
    $('aiSlot'+idx).appendChild(cv);
    aiPicked[idx] = true; $('aiRec'+idx).disabled = false;
    toast('已截取帧'+(idx+1)+'（演示画面，真实版来自产出视频）');
  };
  window.aiRecog = function(idx){
    if(!aiPicked[idx]) return;
    $('aiKw'+idx).textContent = '识别中…';
    var demoKw = [['城市','街道','车辆'],['军队','检阅','队列'],['战机','编队','天空']];
    setTimeout(function(){
      aiKws[idx] = demoKw[idx % 3];
      $('aiKw'+idx).innerHTML = aiKws[idx].map(function(k){ return '<span class="tag">'+k+'</span>'; }).join(' ');
      var used = [];
      aiKws.forEach(function(k){ k.forEach(function(w){ if(used.indexOf(w)<0) used.push(w); }); });
      // 综合源文件名关键词（演示：裁剪测试 → 示例关键词）
      var srcKws = ['军事','演练'];
      srcKws.forEach(function(w){ if(used.indexOf(w)<0) used.push(w); });
      var directionTag = (currentAiTask && currentAiTask.direction==='vertical') ? '竖屏' : '横屏';
      $('aiName').value = '通用_' + used.join('_') + '_' + directionTag;
      toast('已识别帧'+(idx+1)+'，综合源文件名关键词后生成候选名');
    }, 600);
  };
  window.applyAiName = function(){
    if(!currentAiTask) return;
    var nm = $('aiName').value;
    if(nm.indexOf('（')===0){ toast('先完成识别'); return; }
    currentAiTask.name = nm;
    $('aiModal').classList.remove('open');
    renderTasks(); toast('已重命名：' + nm);
  };
})();
</script>
</body>
</html>
